<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MailTrace AI - IP Geolocation</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      #map {
        height: 500px;
        width: 100%;
      }
      .controls {
        margin-bottom: 15px;
      }
      textarea {
        width: 400px;
        height: 80px;
      }
    </style>
  </head>
  <body>
    <h2>MailTrace AI - IP Geolocation</h2>
    <div class="controls">
      <label>Enter IPs (comma-separated):<br /></label>
      <textarea id="ips">8.8.8.8, 1.1.1.1</textarea><br />
      <button onclick="loadLocations()">Show on Map</button>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const map = L.map("map").setView([20, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
      }).addTo(map);

      let markers = [];

      async function loadLocations() {
        const text = document.getElementById("ips").value;
        const ips = text
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
        if (!ips.length) return;

        const res = await fetch("/geolocate_ips", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(ips),
        });
        const data = await res.json();

        // Clear old markers
        markers.forEach((m) => map.removeLayer(m));
        markers = [];

        if (!data.length) {
          alert("No location data found for given IPs.");
          return;
        }

        data.forEach((item) => {
          if (item.lat && item.lon) {
            const marker = L.marker([item.lat, item.lon])
              .addTo(map)
              .bindPopup(
                `<b>${item.ip}</b><br/>
               ${item.city || ""}, ${item.region || ""}<br/>
               ${item.country || ""}<br/>
               ${item.org || ""}`,
              );
            markers.push(marker);
          }
        });

        // Fit bounds
        const group = new L.featureGroup(markers);
        map.fitBounds(group.getBounds(), { padding: [50, 50] });
      }
    </script>
  </body>
</html>
